name: Express Reel (render only, no publish)

# One click → one finished reel to download. Never publishes anywhere.
#
#   Actions → "Express Reel" → Run workflow
#     seed:  leave blank to render the next unrendered seed in reels/express/seeds/
#     music: auto  = pick the best 45s window from the Suno tracks in the
#                    "suno-library" release (falls back to ElevenLabs ambience if empty)
#            ambient = ElevenLabs ambience only
#            none    = voice only
#
# Output: a release named express-<REEL_ID> with
#   <REEL_ID>_FINAL.mp4   (with Suno music when available)
#   <REEL_ID>_caption.txt (title + caption + hashtags, ready to paste)
# and the reel is logged in reels/express/rendered.json so it isn't rendered twice.

on:
  # Also runs when reels/express/render-request.txt changes on main, so a render
  # can be requested without the Actions UI. File format, one value per line:
  #   1 seed path   2 music (auto|ambient|none)   3 cache_bust   4 regen_clips
  push:
    branches: [main]
    paths: ['reels/express/render-request.txt']
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed path (blank = next unrendered seed)'
        required: false
        default: ''
      music:
        description: 'auto | ambient | none'
        required: false
        default: 'auto'
      cache_bust:
        description: 'Any value forces fresh Runway clips (blank = resume a crashed run)'
        required: false
        default: ''
      regen_clips:
        description: 'Clip numbers to regenerate, keeping the other cached clips (e.g. 2,4,5)'
        required: false
        default: ''

concurrency:
  group: express-reel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: in
        env:
          IN_SEED: ${{ inputs.seed }}
          IN_MUSIC: ${{ inputs.music }}
          IN_CACHE_BUST: ${{ inputs.cache_bust }}
          IN_REGEN: ${{ inputs.regen_clips }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            F=reels/express/render-request.txt
            IN_SEED=$(sed -n 1p "$F" | tr -d '[:space:]')
            IN_MUSIC=$(sed -n 2p "$F" | tr -d '[:space:]')
            IN_CACHE_BUST=$(sed -n 3p "$F" | tr -d '[:space:]')
            IN_REGEN=$(sed -n 4p "$F" | tr -d '[:space:]')
          fi
          IN_MUSIC=${IN_MUSIC:-auto}
          { printf '%s' "$IN_SEED" | grep -Eq '^[A-Za-z0-9_./-]*$' && ! printf '%s' "$IN_SEED" | grep -q '\.\.'; } || { echo "bad seed path" >&2; exit 1; }
          printf '%s' "$IN_MUSIC" | grep -Eq '^(auto|ambient|none)$' || { echo "music must be auto, ambient or none" >&2; exit 1; }
          printf '%s' "$IN_CACHE_BUST" | grep -Eq '^[A-Za-z0-9_.-]*$' || { echo "bad cache_bust" >&2; exit 1; }
          printf '%s' "$IN_REGEN" | grep -Eq '^([0-9]+(,[0-9]+)*)?$' || { echo "bad regen_clips" >&2; exit 1; }
          {
            echo "seed=$IN_SEED"; echo "music=$IN_MUSIC"
            echo "cache_bust=$IN_CACHE_BUST"; echo "regen_clips=$IN_REGEN"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies and tools
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          # Brand subtitle font (Cormorant Garamond, static Regular, OFL) is vendored
          # in assets/fonts: libass can't select the upstream variable font by family.
          ls -la assets/fonts

      - name: Pick and build the seed
        id: seed
        run: |
          SEED="${{ steps.in.outputs.seed }}"
          if [ -z "$SEED" ]; then
            SEED=$(npx tsx scripts/express-build.ts --next)
          fi
          SPEC=$(npx tsx scripts/express-build.ts "$SEED" | tail -1)
          REEL_ID=$(jq -r .reel_id "$SPEC")
          TITLE=$(jq -r .express.title "$SPEC")
          echo "seed=$SEED"       >> "$GITHUB_OUTPUT"
          echo "spec=$SPEC"       >> "$GITHUB_OUTPUT"
          echo "reel_id=$REEL_ID" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE"     >> "$GITHUB_OUTPUT"
          echo "Rendering $REEL_ID — $TITLE"

      - name: Fetch Suno library
        id: suno
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/suno
          COUNT=0
          if [ "${{ steps.in.outputs.music }}" = "auto" ]; then
            gh release download suno-library -p "*.mp3" -D /tmp/suno 2>/dev/null || true
            COUNT=$(ls /tmp/suno/*.mp3 2>/dev/null | wc -l)
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Suno tracks available: $COUNT"

      - name: Prepare render spec
        id: render_spec
        run: |
          SPEC="${{ steps.seed.outputs.spec }}"
          OUT=/tmp/render-spec.json
          if [ "${{ steps.suno.outputs.count }}" != "0" ] || [ "${{ steps.in.outputs.music }}" = "none" ]; then
            # Suno is mixed afterwards (or no music wanted): stop the generator adding ambience.
            jq 'del(.music_config.description)' "$SPEC" > "$OUT"
          else
            cp "$SPEC" "$OUT"
          fi
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Restore Runway clip checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/runway-clip-checkpoint.json
            /tmp/runway-0*.mp4
          key: express-clips-${{ steps.seed.outputs.reel_id }}-${{ steps.in.outputs.cache_bust || 'default' }}-${{ github.run_id }}
          restore-keys: |
            express-clips-${{ steps.seed.outputs.reel_id }}-${{ steps.in.outputs.cache_bust || 'default' }}-

      - name: Load preset clips
        # Footage made outside the engine can stand in for planned clips. Commit it as
        # reels/express/presets/<REEL_ID>/clipNN.mp4 (NN = 1-based clip number). Those
        # clips are marked done in the checkpoint, so Runway only generates (and
        # charges for) the rest.
        env:
          REEL_ID: ${{ steps.seed.outputs.reel_id }}
        run: |
          DIR="reels/express/presets/$REEL_ID"
          CP=/tmp/runway-clip-checkpoint.json
          [ -f "$CP" ] || echo '{}' > "$CP"
          for f in "$DIR"/clip*.mp4; do
            [ -e "$f" ] || { echo "No preset clips for $REEL_ID."; break; }
            n=$(basename "$f" .mp4 | sed -E 's/^clip0*([0-9]+)$/\1/')
            printf '%s' "$n" | grep -Eq '^[0-9]+$' || { echo "skipping $f"; continue; }
            dest="/tmp/runway-0preset-$n.mp4"
            cp "$f" "$dest"
            jq --arg k "$((n - 1))" --arg v "$dest" '.[$k] = $v' "$CP" > "$CP.tmp" && mv "$CP.tmp" "$CP"
            echo "clip $n preset from $f"
          done
          cat "$CP"

      - name: Drop clips marked for regeneration
        if: ${{ steps.in.outputs.regen_clips != '' }}
        env:
          REGEN_CLIPS: ${{ steps.in.outputs.regen_clips }}
        run: |
          if ! printf '%s' "$REGEN_CLIPS" | grep -Eq '^[0-9]+(,[0-9]+)*$'; then
            echo "regen_clips must be clip numbers separated by commas, e.g. 2,4,5" >&2
            exit 1
          fi
          CP=/tmp/runway-clip-checkpoint.json
          if [ ! -f "$CP" ]; then
            echo "No cached clips found; every clip will be generated."
            exit 0
          fi
          for n in $(printf '%s' "$REGEN_CLIPS" | tr ',' ' '); do
            # Checkpoint keys are 0-based clip indexes; inputs are 1-based clip numbers.
            idx=$((n - 1))
            path=$(jq -r --arg k "$idx" '.[$k] // empty' "$CP")
            [ -n "$path" ] && rm -f "$path"
            jq --arg k "$idx" 'del(.[$k])' "$CP" > "$CP.tmp" && mv "$CP.tmp" "$CP"
            echo "clip $n will be regenerated"
          done
          cat "$CP"

      - name: Generate voiceover + video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          RUNWAY_API_KEY:     ${{ secrets.RUNWAY_API_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          REEL_SPEC_PATH:     ${{ steps.render_spec.outputs.path }}
          REEL_RELEASE_TAG:   express-${{ steps.seed.outputs.reel_id }}
          REEL_RELEASE_NAME:  'Express ${{ steps.seed.outputs.reel_id }}'
          CLIP_CHECKPOINT_PATH: /tmp/runway-clip-checkpoint.json
        run: npm run generate

      - name: Save Runway clip checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/runway-clip-checkpoint.json
            /tmp/runway-0*.mp4
          key: express-clips-${{ steps.seed.outputs.reel_id }}-${{ steps.in.outputs.cache_bust || 'default' }}-${{ github.run_id }}

      - name: Mix best Suno window (music intelligence)
        id: mix
        if: ${{ steps.suno.outputs.count != '0' }}
        run: |
          FINAL=$(ls -t /tmp/final_subtitled.mp4 /tmp/final_branded.mp4 /tmp/final.mp4 2>/dev/null | head -1)
          ARGS=""
          for f in /tmp/suno/*.mp3; do ARGS="$ARGS --music $f"; done
          OUTDIR="output/music_intelligence/${{ steps.seed.outputs.reel_id }}"
          npx tsx scripts/analyze-reel-music.ts \
            --reel "${{ steps.seed.outputs.spec }}" \
            --video "$FINAL" \
            --voice /tmp/voiceover.mp3 \
            --output "$OUTDIR" $ARGS
          MIXED=$(ls "$OUTDIR"/*_final_mixed.mp4 | head -1)
          echo "mixed=$MIXED" >> "$GITHUB_OUTPUT"
          echo "## Music selection" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -40 "$OUTDIR/MUSIC_REPORT.txt" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final video + caption
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID="${{ steps.seed.outputs.reel_id }}"
          SPEC="${{ steps.seed.outputs.spec }}"
          TAG="express-$ID"
          MIXED="${{ steps.mix.outputs.mixed }}"
          if [ -n "$MIXED" ] && [ -f "$MIXED" ]; then
            SRC="$MIXED"
          else
            SRC=$(ls -t /tmp/final_subtitled.mp4 /tmp/final_branded.mp4 /tmp/final.mp4 2>/dev/null | head -1)
          fi
          cp "$SRC" "/tmp/${ID}_FINAL.mp4"
          {
            echo "TITLE (YouTube):"
            jq -r .express.title "$SPEC"
            echo
            echo "CAPTION (Instagram / YouTube description):"
            jq -r .instagram_config.caption "$SPEC"
          } > "/tmp/${ID}_caption.txt"
          gh release upload "$TAG" "/tmp/${ID}_FINAL.mp4" "/tmp/${ID}_caption.txt" --clobber
          URL=$(gh release view "$TAG" --json url -q .url)
          {
            echo "## ✅ $ID ready to post"
            echo "**Title:** ${{ steps.seed.outputs.title }}"
            echo ""
            echo "Download the video and caption here: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log rendered reel
        run: |
          LOG=reels/express/rendered.json
          [ -f "$LOG" ] || echo '[]' > "$LOG"
          jq --arg id "${{ steps.seed.outputs.reel_id }}" \
             --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg run "${{ github.run_id }}" \
             --arg music "${{ steps.mix.outputs.mixed != '' && 'suno' || steps.in.outputs.music }}" \
             '. + [{reel_id: $id, rendered_at: $at, run_id: $run, music: $music}]' "$LOG" > /tmp/log.json
          mv /tmp/log.json "$LOG"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$LOG"
          git commit -m "express: rendered ${{ steps.seed.outputs.reel_id }} [skip ci]"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
