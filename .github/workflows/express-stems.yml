name: Express Stems (clean clips for post, no generation)

# Uploads the cached, caption-free Runway clips of an Express reel to its
# release (express-<REEL_ID>) so post-production can work from clean picture.
# Restores the clip cache only: it never calls Runway or ElevenLabs, so it
# costs no credits and leaves the published voiceover untouched.

on:
  workflow_dispatch:
    inputs:
      reel_id:
        description: 'Reel ID, e.g. NDCH_022_THE_STATUE'
        required: true
      cache_bust:
        description: 'Same cache_bust used for the render (blank = default)'
        required: false
        default: ''

jobs:
  stems:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Validate reel id
        env:
          REEL_ID: ${{ inputs.reel_id }}
        run: |
          if ! printf '%s' "$REEL_ID" | grep -Eq '^[A-Za-z0-9_]+$'; then
            echo "reel_id must be letters, digits and underscores" >&2
            exit 1
          fi

      - name: Restore Runway clip checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/runway-clip-checkpoint.json
            /tmp/runway-0*.mp4
          key: express-clips-${{ inputs.reel_id }}-${{ inputs.cache_bust || 'default' }}-stems-${{ github.run_id }}
          restore-keys: |
            express-clips-${{ inputs.reel_id }}-${{ inputs.cache_bust || 'default' }}-
          fail-on-cache-miss: true

      - name: Upload clean clips to the reel's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REEL_ID: ${{ inputs.reel_id }}
        run: |
          mkdir -p /tmp/stems
          i=0
          # Checkpoint maps clip index -> path; keep timeline order.
          for f in $(jq -r 'to_entries | sort_by(.key | tonumber) | .[].value' /tmp/runway-clip-checkpoint.json); do
            i=$((i + 1))
            cp "$f" "/tmp/stems/${REEL_ID}_stem_clip$(printf '%02d' "$i").mp4"
          done
          ls -la /tmp/stems
          gh release upload "express-${REEL_ID}" /tmp/stems/*.mp4 --clobber
