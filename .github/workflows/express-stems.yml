name: Express Stems (clean clips for post, no generation)

# Uploads the cached, caption-free Runway clips of an Express reel to its
# release (express-<REEL_ID>) so post-production can work from clean picture.
# Restores the clip cache only: it never calls Runway or ElevenLabs, so it
# costs no credits and leaves the published voiceover untouched.

on:
  # Also runs when reels/express/stems-request.txt changes on main (one reel ID
  # per file), so stems can be requested without the Actions UI.
  push:
    branches: [main]
    paths: ['reels/express/stems-request.txt']
  workflow_dispatch:
    inputs:
      reel_id:
        description: 'Reel ID, e.g. NDCH_022_THE_STATUE'
        required: true
      cache_bust:
        description: 'Same cache_bust used for the render (blank = default)'
        required: false
        default: ''

jobs:
  stems:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'

      - name: Resolve and validate reel id
        id: req
        env:
          INPUT_REEL_ID: ${{ inputs.reel_id }}
          INPUT_CACHE_BUST: ${{ inputs.cache_bust }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REEL_ID=$(head -1 reels/express/stems-request.txt | tr -d '[:space:]')
            CACHE_BUST=$(sed -n 2p reels/express/stems-request.txt | tr -d '[:space:]')
          else
            REEL_ID="$INPUT_REEL_ID"
            CACHE_BUST="$INPUT_CACHE_BUST"
          fi
          if ! printf '%s' "$REEL_ID" | grep -Eq '^[A-Za-z0-9_]+$'; then
            echo "reel_id must be letters, digits and underscores" >&2
            exit 1
          fi
          if [ -n "$CACHE_BUST" ] && ! printf '%s' "$CACHE_BUST" | grep -Eq '^[A-Za-z0-9_.-]+$'; then
            echo "cache_bust must be letters, digits, dot, dash or underscore" >&2
            exit 1
          fi
          echo "reel_id=$REEL_ID" >> "$GITHUB_OUTPUT"
          echo "cache_bust=${CACHE_BUST:-default}" >> "$GITHUB_OUTPUT"

      - name: Restore Runway clip checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/runway-clip-checkpoint.json
            /tmp/runway-0*.mp4
          key: express-clips-${{ steps.req.outputs.reel_id }}-${{ steps.req.outputs.cache_bust }}-stems-${{ github.run_id }}
          restore-keys: |
            express-clips-${{ steps.req.outputs.reel_id }}-${{ steps.req.outputs.cache_bust }}-
          fail-on-cache-miss: true

      - name: Upload clean clips to the reel's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REEL_ID: ${{ steps.req.outputs.reel_id }}
        run: |
          mkdir -p /tmp/stems
          # Checkpoint maps 0-based clip index -> path. Name each file by its real
          # clip number, so a partial cache (e.g. only clip 2) is labelled correctly.
          jq -r 'to_entries | sort_by(.key | tonumber) | .[] | "\(.key) \(.value)"' /tmp/runway-clip-checkpoint.json |
          while read -r k f; do
            [ -f "$f" ] || continue
            cp "$f" "/tmp/stems/${REEL_ID}_stem_clip$(printf '%02d' "$((k + 1))").mp4"
          done
          ls -la /tmp/stems
          gh release view "express-${REEL_ID}" >/dev/null 2>&1 || gh release create "express-${REEL_ID}" --title "Express ${REEL_ID}" --notes "Express render assets for ${REEL_ID}."
          gh release upload "express-${REEL_ID}" /tmp/stems/*.mp4 --clobber
