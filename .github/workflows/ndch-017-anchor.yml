name: NDCH-017 Director's Cut — S1 Anchor
on:
  workflow_dispatch:
jobs:
  generate-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies and tools
        run: npm ci && sudo apt-get install -y ffmpeg
      - name: Generate S1 anchor still (v3)
        id: anchor
        env:
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx generate-017-anchor.ts
      - name: Summary
        if: always()
        run: |
          echo "### Anchor v3 Result" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.anchor.outputs.anchor_url }}" >> $GITHUB_STEP_SUMMARY
